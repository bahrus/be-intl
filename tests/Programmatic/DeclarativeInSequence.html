<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic declarative in sequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <data id=plain value="12345"></data>
    <data id=euros value=123456.789 lang="de-DE"></data>
    <time id=friday lang="ar-EG" datetime=2011-11-18T14:54:39.929Z></time>
    <script type=module>
        import {defBeIntl} from 'be-intl/def.js';
        await defBeIntl(document.body);
        // Only the first property needs to go through .set --
        // it triggers the attachment of the enhancement.
        // equivalent to <data be-intl value=12345>
        plain.enh.set.beIntl.format = {};
        // equivalent to <data lang=de-DE be-intl='{ "style": "currency", "currency": "EUR" }'>
        euros.enh.set.beIntl.format = {style: 'currency', currency: 'EUR'};
        friday.enh.set.beIntl.format = {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'};
    </script>
</body>
</html>
