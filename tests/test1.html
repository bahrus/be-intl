<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <data be-intl value="12345"></data>

    <data value=123456.789 lang="de-DE" be-intl='{ "style": "currency", "currency": "EUR" }'></data>
    
    <time lang="ar-EG" datetime=2011-11-18T14:54:39.929Z be-intl='{ "weekday": "long", "year": "numeric", "month": "long", "day": "numeric" }'></time>
    <div id='target'></div>

    <script type=module>
        import '/emc.js'
    </script>
    <script>
        function runScript(){
            const data = document.querySelector('data');
            if(data.textContent === '12,345'){
                target.setAttribute('mark', 'good');
            }
            
        }
        setTimeout(() => {
            runScript();
        }, 500);
    </script>
</body>
</html>
