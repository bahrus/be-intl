<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic declarative out of sequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <data id=plain value="12345"></data>
    <data id=euros value=123456.789 lang="de-DE"></data>
    <time id=friday lang="ar-EG" datetime=2011-11-18T14:54:39.929Z></time>
    <script type=module>
        import {defBeIntl} from 'be-intl/def.js';
        // Set before the config is registered -- .set creates a placeholder
        // and defers the real spawn until defBeIntl registers it.
        plain.enh.set.beIntl.format = {};
        euros.enh.set.beIntl.format = {style: 'currency', currency: 'EUR'};
        friday.enh.set.beIntl.format = {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'};
        await defBeIntl(document.body);
    </script>
</body>
</html>
